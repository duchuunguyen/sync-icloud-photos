[package]
name = "sync-icloud-photos"
version = "0.1.0"
edition = "2021"
description = "Sync a folder of iCloud photos to another folder"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sync-icloud-engine = { path = "../engine" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
